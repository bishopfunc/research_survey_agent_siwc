# Self-hosted VPS (design 0032). APP_IMAGE and PUBLIC_HOST come from .env, written by scripts/deploy-vps.sh.
name: survey
services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    init: true
    volumes:
      - poc:/app/.poc
      - codex-home:/home/node/.codex
    # Only the login callback is published, and only on the VPS loopback: it is reached through the owner's SSH port forward.
    ports:
      - "127.0.0.1:1456:1456"
  gate:
    image: ${APP_IMAGE}
    restart: unless-stopped
    init: true
    # Shares the app's network, so the PoC server stays on 127.0.0.1:8788.
    network_mode: service:app
    command: ["node_modules/.bin/tsx", "scripts/vps-gate.ts"]
    environment:
      PUBLIC_ORIGIN: https://${PUBLIC_HOST}
      GATE_STATE: /app/.gate/gate.json
    volumes:
      - gate:/app/.gate
    depends_on: [app]
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [gate]
volumes:
  poc:
  codex-home:
  gate:
  caddy-data:
  caddy-config:
