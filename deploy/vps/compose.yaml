# Self-hosted VPS (design 0032). APP_IMAGE, PUBLIC_HOST and GATE_TOKEN_KEY come from .env, written by scripts/deploy-vps.sh.
name: survey
services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    init: true
    # The gate and the PoC server run together (deploy/vps/start.sh); Caddy reaches the gate on app:8080.
    command: ["bash", "deploy/vps/start.sh"]
    environment:
      PUBLIC_ORIGIN: https://${PUBLIC_HOST}
      GATE_STATE: /app/.gate/gate.json
      # Encrypts the kept ChatGPT tokens; generated once on the VPS by scripts/deploy-vps.sh.
      GATE_TOKEN_KEY: ${GATE_TOKEN_KEY}
      # app-server by default; exec is the fallback (design 0036). Concurrent paper readers of a new survey and their model;
      # empty keeps the app's default (design 0037).
      CODEX_TRANSPORT: ${CODEX_TRANSPORT:-app-server}
      EXTRACT_CONCURRENCY: ${EXTRACT_CONCURRENCY:-20}
      EXTRACT_MODEL: ${EXTRACT_MODEL:-}
      SURVEY_MODEL: ${SURVEY_MODEL:-}
      # OpenAlex for the bibliography and search_papers (design 0039); the owner puts it in .env, it never reaches Codex.
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    volumes:
      - poc:/app/.poc
      - gate:/app/.gate
      - codex-home:/home/node/.codex
    # Only the login callback is published, and only on the VPS loopback: it is reached through the owner's SSH port forward.
    ports:
      - "127.0.0.1:1456:1456"
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]
volumes:
  poc:
  codex-home:
  gate:
  caddy-data:
  caddy-config:
