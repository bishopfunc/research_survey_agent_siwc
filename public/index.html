<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Workers SIWC 検証</title><style>body{font:16px system-ui;max-width:760px;margin:60px auto;padding:20px;background:#f5f7fa}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0}pre{white-space:pre-wrap;background:white;padding:20px}label{display:block}</style><h1>Workers × ChatGPTプラン 検証</h1><p>正式取得したSIWCトークンをWorkerのSecretに設定してから使用してください。OAuth登録・ログインはこの検証の対象外です。</p><label>管理用Secret<input id="secret" type="password" autocomplete="off"></label><button id="list">モデル一覧を取得</button><label>モデル<select id="model"></select></label><label>入力<textarea id="input">Return exactly: SIWC_OK</textarea></label><button id="run">推論を検証</button><pre id="out">未実行</pre><script type="module">
import {consumeSSE} from '/probe-client.mjs';
const el=id=>document.getElementById(id);const auth=()=>({'X-Admin-Secret':el('secret').value});
el('list').onclick=async()=>{try{const r=await fetch('/models',{headers:auth()});if(!r.ok)throw Error('HTTP '+r.status);const b=await r.json();el('model').replaceChildren(...b.models.map(m=>new Option(m.display_name,m.slug)));el('out').textContent=b.models.length+' モデル取得（推論権限は未検証）';}catch(e){el('out').textContent=e.message;}};
el('run').onclick=async()=>{el('run').disabled=true;el('out').textContent='';try{const r=await fetch('/probe',{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({model:el('model').value,input:el('input').value})});await consumeSSE(r,d=>el('out').textContent+=d);el('out').textContent+='\nPASS: response.completed';}catch(e){el('out').textContent+='\nFAIL: '+e.message;}finally{el('run').disabled=false;}};
</script></html>
